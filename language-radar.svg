<svg id="gh-dark-mode-only" width="440" height="210" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
}

#background {
  width: calc(100% - 10px);
  height: calc(100% - 10px);
  fill: white;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
  rx: 6px;
  ry: 6px;
}

#gh-dark-mode-only:target #background {
  fill: #0d1117;
  stroke-width: 0.5px;
}

.title {
  font-size: 16px;
  font-weight: 600;
  fill: rgb(36, 41, 46);
}

#gh-dark-mode-only:target .title {
  fill: #c9d1d9;
}

.grid {
  fill: none;
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
}

#gh-dark-mode-only:target .grid {
  stroke: rgba(110, 118, 129, 0.4);
}

.axis {
  stroke: rgb(225, 228, 232);
  stroke-width: 1px;
}

#gh-dark-mode-only:target .axis {
  stroke: rgba(110, 118, 129, 0.4);
}

.axis-label {
  font-size: 10px;
  font-weight: 600;
}

.legend-name {
  font-size: 12px;
  fill: rgb(36, 41, 46);
}

#gh-dark-mode-only:target .legend-name {
  fill: #c9d1d9;
}

.legend-percent {
  font-size: 12px;
  font-weight: 600;
  fill: rgb(88, 96, 105);
}

#gh-dark-mode-only:target .legend-percent {
  fill: #8b949e;
}

.dim {
  font-size: 13px;
  fill: rgb(88, 96, 105);
}

#gh-dark-mode-only:target .dim {
  fill: #8b949e;
}
</style>
